<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. El worker de pdf.js entra
     por 'self' (archivo real bajo file://) — un worker desde blob: NO pasa. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
<title>Quire</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/quire.css">
<link rel="stylesheet" href="./css/lector.css">
<link rel="stylesheet" href="./css/imprimir.css">
<link rel="stylesheet" href="./css/herramientas.css">
<link rel="stylesheet" href="./css/paginas.css">
<link rel="stylesheet" href="./css/chrome.css">
<link rel="stylesheet" href="./css/convertir.css">
<link rel="stylesheet" href="./css/presentar.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0a0b0d;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 46px; height: 46px; stroke: #f2f4f7; fill: none;
                     stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  /* La marca se DIBUJA, no aparece: el pliego primero, el doblez después.
     Los dasharray son la longitud real de cada path — si redibujás la marca,
     medilos de nuevo o el trazo arranca cortado. */
  #boot-splash path { stroke-dasharray: 36; stroke-dashoffset: 36;
                      animation: boot-draw .72s cubic-bezier(.16,1,.3,1) forwards; }
  #boot-splash path:last-child { stroke-dasharray: 6; stroke-dashoffset: 6;
                                 opacity: .34; animation-delay: .28s; }
  @keyframes boot-draw { to { stroke-dashoffset: 0 } }
</style>

<div id="boot-splash">
  <!-- Un quire: el pliego de hojas doblado por el lomo. -->
  <svg viewBox="0 0 16 16">
    <path d="M8 4.3 2.4 6.2v5.9L8 10.3l5.6 1.8V6.2z"/>
    <path d="M8 4.3v6"/>
  </svg>
</div>

<div class="ox-app">

  <!-- ── Titlebar propia: acá no hay frame nativo ─────────────────────────── -->
  <header class="ox-titlebar">
    <div class="ox-brand ox-no-drag" id="brand">
      <svg class="ox-brand__mark ox-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 4.3 2.4 6.2v5.9L8 10.3l5.6 1.8V6.2z"/>
        <path class="ox-brand__trail" d="M8 4.3v6"/>
      </svg>
      <span class="ox-brand__name">Quire</span>
    </div>

    <!-- ── Navegación ─────────────────────────────────────────────────────
         Desde la 1.2.0 no hay rail: las vistas viven acá arriba, en la
         titlebar que ya existía, y el documento se queda con los 224 px que
         el rail le cobraba siempre (decisión de Fran, maqueta en
         S:\mockups\quire\sin-rail.html, variante 4).

         Siguen siendo .ox-navitem a propósito: el router marca el activo por
         esa clase, y así router.js sigue igual al de Onyx. La piel de pestaña
         es de quire.css (.qr-vista). -->

    <!-- El atajo vive en el tooltip: si no, Ctrl+O no lo decía ningún lado
         salvo el «+» de la franja, que con un documento no se ve (ux-17). -->
    <button class="ox-iconbtn ox-flashable qr-abrir" id="btn-abrir" aria-label="Abrir un PDF"
            data-tip="Abrir un PDF" data-tip-key="Ctrl O"><i data-icon="folder"></i></button>

    <div class="ox-vr qr-tb-vr"></div>

    <nav class="qr-vistas" id="qr-vistas" aria-label="Vistas">
      <button class="ox-navitem qr-vista" data-view="lector" data-nombre="Documento">
        <i data-icon="book"></i><span class="qr-vista__nombre">Documento</span>
      </button>
      <button class="ox-navitem qr-vista" data-view="paginas" data-nombre="Páginas">
        <i data-icon="grid"></i><span class="qr-vista__nombre">Páginas</span>
        <span class="ox-navitem__count ox-plegable--ancho" id="nav-paginas-count" hidden></span>
      </button>
      <button class="ox-navitem qr-vista" data-view="imprimir" data-nombre="Imprimir">
        <i data-icon="printer"></i><span class="qr-vista__nombre">Imprimir</span>
      </button>
      <button class="ox-navitem qr-vista" data-view="herramientas" data-nombre="Herramientas">
        <i data-icon="tools"></i><span class="qr-vista__nombre">Herramientas</span>
      </button>
      <button class="ox-navitem qr-vista" data-view="convertir" data-nombre="Convertir">
        <i data-icon="convertir"></i><span class="qr-vista__nombre">Convertir</span>
        <span class="ox-navitem__count ox-plegable--ancho" id="nav-convertir-count" hidden></span>
      </button>
      <!-- La vitrina del framework, no una función de Quire: solo se ve en
           modo desarrollo (--dev o QUIRE_DEV; ver boot() en app.js). -->
      <button class="ox-navitem qr-vista" data-view="piezas" data-nombre="Piezas" id="nav-piezas" hidden>
        <i data-icon="layers"></i><span class="qr-vista__nombre">Piezas</span>
      </button>
    </nav>

    <!-- Ajustes es una vista más, pero de sistema: va solo con su ícono, contra
         los botones de ventana, como en el rail iba en su propio grupo. -->
    <button class="ox-navitem qr-vista qr-vista--ajustes" data-view="ajustes" data-nombre="Ajustes"
            aria-label="Ajustes" data-tip="Ajustes"><i data-icon="settings"></i></button>

    <!-- Un solo indicador para todas: se desliza a la pestaña activa (app.js,
         ubicarIndicador). Es hijo de la titlebar y no del nav porque también
         tiene que llegar a Ajustes. -->
    <span class="qr-vistas__ind" id="qr-vistas-ind" aria-hidden="true"></span>

    <div class="ox-wincontrols">
      <button class="ox-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
      <button class="ox-wincontrol" id="win-max"   aria-label="Maximizar"><i data-icon="winMax"></i></button>
      <button class="ox-wincontrol ox-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
    </div>
  </header>

  <!-- ── Pestañas ─────────────────────────────────────────────────────────
       Vive fuera de la vista porque el documento activo es estado de la APP,
       no del lector: cambiar de pestaña también cambia lo que ven Páginas,
       Imprimir y Herramientas.

       Nunca lleva `hidden`. Con un solo documento se esconde plegando su alto
       a 0, y eso no es un capricho de animación: un `display:none` la sacaría
       de ser ítem del grid de .ox-app, y el cuerpo caería en la fila de alto
       automático que le tocaba a ella. -->
  <nav class="qr-tabs" id="qr-tabs" aria-label="Documentos abiertos"></nav>

  <div class="ox-body">

    <!-- ── Vista ─────────────────────────────────────────────────────────── -->
    <main class="ox-main" id="view"></main>
  </div>

  <!-- ── Statusbar ───────────────────────────────────────────────────────── -->
  <footer class="ox-statusbar">
    <div class="ox-statusbar__item" id="stat-doc" data-tip="Documento abierto" data-tip-side="top">
      <i data-icon="file"></i> <span class="ox-statusbar__value" id="stat-doc-name">Ningún documento</span>
    </div>
    <div class="ox-statusbar__item ox-plegable--ancho" id="stat-pagina" data-tip="Página actual" data-tip-side="top" hidden>
      <span class="ox-statusbar__value ox-num" id="stat-pagina-value"></span>
    </div>
    <div class="ox-statusbar__item ox-plegable--ancho" id="stat-medida" data-tip="Tamaño real de la página" data-tip-side="top" hidden>
      <span class="ox-statusbar__value ox-num" id="stat-medida-value"></span>
    </div>
    <div class="ox-spacer"></div>
    <div class="ox-statusbar__item ox-plegable--ancho" id="stat-impresora" data-tip="Impresora activa" data-tip-side="top" hidden>
      <i data-icon="printer"></i> <span class="ox-statusbar__value" id="stat-impresora-value"></span>
    </div>
    <!-- Lo que queda visible cuando cerrás el cartel de actualización. -->
    <div class="ox-statusbar__item qr-stat-act ox-plegable--ancho" id="stat-update" data-tip-side="top" hidden></div>
  </footer>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="ox-layer"></div>

<script type="module" src="./js/app.js"></script>
