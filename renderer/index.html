<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. El worker de pdf.js entra
     por 'self' (archivo real bajo file://) — un worker desde blob: NO pasa. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
<title>Quire</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/quire.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0a0b0d;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 46px; height: 46px; stroke: #f2f4f7; fill: none;
                     stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  /* La marca se DIBUJA, no aparece: el pliego primero, el doblez después.
     Los dasharray son la longitud real de cada path — si redibujás la marca,
     medilos de nuevo o el trazo arranca cortado. */
  #boot-splash path { stroke-dasharray: 36; stroke-dashoffset: 36;
                      animation: boot-draw .72s cubic-bezier(.16,1,.3,1) forwards; }
  #boot-splash path:last-child { stroke-dasharray: 6; stroke-dashoffset: 6;
                                 opacity: .34; animation-delay: .28s; }
  @keyframes boot-draw { to { stroke-dashoffset: 0 } }
</style>

<div id="boot-splash">
  <!-- Un quire: el pliego de hojas doblado por el lomo. -->
  <svg viewBox="0 0 16 16">
    <path d="M8 4.3 2.4 6.2v5.9L8 10.3l5.6 1.8V6.2z"/>
    <path d="M8 4.3v6"/>
  </svg>
</div>

<div class="ox-app">

  <!-- ── Titlebar propia: acá no hay frame nativo ─────────────────────────── -->
  <header class="ox-titlebar">
    <div class="ox-brand ox-no-drag" data-tip="Quire" id="brand">
      <svg class="ox-brand__mark ox-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 4.3 2.4 6.2v5.9L8 10.3l5.6 1.8V6.2z"/>
        <path class="ox-brand__trail" d="M8 4.3v6"/>
      </svg>
      <span class="ox-brand__name">Quire</span>
    </div>

    <button class="ox-iconbtn ox-iconbtn--sm ox-no-drag" id="btn-palette"
            data-tip="Comandos" data-tip-key="Ctrl K"><i data-icon="search"></i></button>

    <!-- Contexto de la vista actual. Lo llena el router. -->
    <div class="ox-titlebar__context" id="titlebar-context"></div>

    <div class="ox-wincontrols">
      <button class="ox-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
      <button class="ox-wincontrol" id="win-max"   aria-label="Maximizar"><i data-icon="winMax"></i></button>
      <button class="ox-wincontrol ox-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
    </div>
  </header>

  <div class="ox-body">

    <!-- ── Rail ──────────────────────────────────────────────────────────── -->
    <nav class="ox-rail">
      <div class="ox-rail__top">
        <button class="ox-btn ox-btn--secondary ox-flashable" id="btn-abrir" style="width:100%">
          <i data-icon="folder"></i> Abrir
        </button>
      </div>

      <div class="ox-rail__nav ox-scroll">
        <div class="ox-rail__group">
          <button class="ox-navitem" data-view="lector">
            <i data-icon="book"></i> Documento
          </button>
          <button class="ox-navitem" data-view="paginas">
            <i data-icon="grid"></i> Páginas <span class="ox-navitem__count" id="nav-paginas-count"></span>
          </button>
        </div>

        <div class="ox-rail__group">
          <div class="ox-rail__group-label">Producir</div>
          <button class="ox-navitem" data-view="imprimir">
            <i data-icon="printer"></i> Imprimir
          </button>
          <button class="ox-navitem" data-view="herramientas">
            <i data-icon="tools"></i> Herramientas
          </button>
        </div>

        <div class="ox-rail__group">
          <div class="ox-rail__group-label">Sistema</div>
          <button class="ox-navitem" data-view="piezas">
            <i data-icon="layers"></i> Piezas
          </button>
          <button class="ox-navitem" data-view="ajustes">
            <i data-icon="settings"></i> Ajustes
          </button>
        </div>
      </div>

      <div class="ox-rail__foot" id="rail-foot"></div>
    </nav>

    <!-- ── Vista ─────────────────────────────────────────────────────────── -->
    <main class="ox-main" id="view"></main>
  </div>

  <!-- ── Statusbar ───────────────────────────────────────────────────────── -->
  <footer class="ox-statusbar">
    <div class="ox-statusbar__item" id="stat-doc" data-tip="Documento abierto" data-tip-side="top">
      <i data-icon="file"></i> <span class="ox-statusbar__value" id="stat-doc-name">Ningún documento</span>
    </div>
    <div class="ox-statusbar__item" id="stat-pagina" data-tip="Página actual" data-tip-side="top" hidden>
      <span class="ox-statusbar__value ox-num" id="stat-pagina-value">—</span>
    </div>
    <div class="ox-statusbar__item" id="stat-medida" data-tip="Tamaño real de la página" data-tip-side="top" hidden>
      <span class="ox-statusbar__value ox-num" id="stat-medida-value">—</span>
    </div>
    <div class="ox-spacer"></div>
    <div class="ox-statusbar__item" id="stat-impresora" data-tip="Impresora activa" data-tip-side="top" hidden>
      <i data-icon="printer"></i> <span class="ox-statusbar__value" id="stat-impresora-value">—</span>
    </div>
    <div class="ox-statusbar__item" id="stat-version"></div>
  </footer>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="ox-layer"></div>

<script type="module" src="./js/app.js"></script>
